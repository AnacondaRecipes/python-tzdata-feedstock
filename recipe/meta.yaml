{% set name = "tzdata" %}
{% set version = "2026.4" %}

package:
  name: python-{{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f1b8bd365d8d210c55353f4d7f8d6d8561c0ba50d704b700d195a9424bba0d79

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=40.8.0
    - wheel
  run:
    - python

test:
  source_files:
    - tests
    - VERSION
  imports:
    - tzdata
  requires: 
    - pip
    - pytest
    - pytest-subtests
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/python/tzdata
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Provider of IANA time zone data
  description: |
    This is a Python package containing zic-compiled binaries for the IANA time zone database.
    It is intended to be a fallback for systems that do not have system time zone data installed (or don't have it installed in a standard location),
    as a part of PEP 615.
  doc_url: https://tzdata.readthedocs.org
  dev_url: https://github.com/python/tzdata

extra:
  skip-lints:
    - avoid_noarch
  recipe-maintainers:
    - ocefpaf
    - pganssle
    - mbargull
